<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RecNexus | Coach Login</title>
    <style>
        body { background: #070913; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #121628; padding: 30px; border-radius: 15px; border: 1px solid #3b82f6; width: 300px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #070913; border: 1px solid #333; color: white; border-radius: 5px; }
        button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; background: #3b82f6; color: white; }
        #adminPanel { display: none; text-align: center; }
        .btn-toggle { margin-top: 15px; padding: 15px; }
        .btn-on { background: #10b981; }
        .btn-off { background: #ef4444; }
    </style>
</head>
<body>
    <div id="loginForm" class="card">
        <h2>Coach Login</h2>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Enter Panel</button>
    </div>

    <div id="adminPanel" class="card">
        <h2>System Control</h2>
        <p>Status: <span id="statusText">Loading...</span></p>
        <button id="toggleBtn" class="btn-toggle" onclick="toggleStatus()">Loading...</button>
    </div>

    <script>
        let currentStatus = false;
        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value 
                })
            });
            if(res.ok) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                fetchStatus();
            } else { alert("Invalid login!"); }
        }

        async function fetchStatus() {
            const res = await fetch('/api/admin/status');
            const data = await res.json();
            currentStatus = data.isOnline;
            document.getElementById('statusText').innerText = currentStatus ? 'ONLINE' : 'OFFLINE';
            document.getElementById('toggleBtn').innerText = currentStatus ? 'Set Offline' : 'Set Online';
            document.getElementById('toggleBtn').className = 'btn-toggle ' + (currentStatus ? 'btn-off' : 'btn-on');
        }

        async function toggleStatus() {
            await fetch('/api/admin/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isOnline: !currentStatus })
            });
            fetchStatus();
        }
    </script>
</body>
</html>
